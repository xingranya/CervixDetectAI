<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 主背景渐变 -->
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </radialGradient>
    
    <!-- 护盾渐变 -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90CAF9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 光晕效果 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- AI节点渐变 -->
    <radialGradient id="nodeGradient">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </radialGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 光泽效果 -->
    <filter id="gloss">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.5" 
                          specularExponent="10" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-50" y="-50" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceGraphic" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" 
                   k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  
  <!-- 外圆背景 -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" />
  
  <!-- 装饰光晕 -->
  <circle cx="100" cy="100" r="85" fill="url(#glowGradient)" opacity="0.6" />
  
  <!-- 护盾主体 -->
  <path d="M100 35 L145 52 L145 88 Q145 125 100 155 Q55 125 55 88 L55 52 Z" 
        fill="url(#shieldGradient)" 
        filter="url(#shadow)"/>
  
  <!-- 护盾边框 -->
  <path d="M100 35 L145 52 L145 88 Q145 125 100 155 Q55 125 55 88 L55 52 Z" 
        fill="none"
        stroke="#fff"
        stroke-width="2"
        opacity="0.5"/>
  
  <!-- AI 神经网络节点（带光泽） -->
  <g filter="url(#gloss)">
    <!-- 第一层 -->
    <circle cx="78" cy="72" r="5" fill="url(#nodeGradient)" />
    <circle cx="100" cy="68" r="5" fill="url(#nodeGradient)" />
    <circle cx="122" cy="72" r="5" fill="url(#nodeGradient)" />
    
    <!-- 第二层 -->
    <circle cx="70" cy="95" r="5" fill="#42A5F5" />
    <circle cx="100" cy="90" r="6" fill="#42A5F5" />
    <circle cx="130" cy="95" r="5" fill="#42A5F5" />
    
    <!-- 第三层 -->
    <circle cx="85" cy="118" r="5" fill="#1E88E5" />
    <circle cx="115" cy="118" r="5" fill="#1E88E5" />
  </g>
  
  <!-- 神经网络连接线（多彩） -->
  <g stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="78" y1="72" x2="70" y2="95" stroke="#42A5F5" />
    <line x1="78" y1="72" x2="100" y2="90" stroke="#42A5F5" />
    <line x1="100" y1="68" x2="70" y2="95" stroke="#64B5F6" />
    <line x1="100" y1="68" x2="100" y2="90" stroke="#64B5F6" />
    <line x1="100" y1="68" x2="130" y2="95" stroke="#64B5F6" />
    <line x1="122" y1="72" x2="100" y2="90" stroke="#42A5F5" />
    <line x1="122" y1="72" x2="130" y2="95" stroke="#42A5F5" />
    
    <line x1="70" y1="95" x2="85" y2="118" stroke="#1E88E5" />
    <line x1="100" y1="90" x2="85" y2="118" stroke="#1E88E5" />
    <line x1="100" y1="90" x2="115" y2="118" stroke="#1E88E5" />
    <line x1="130" y1="95" x2="115" y2="118" stroke="#1E88E5" />
  </g>
  
  <!-- 医疗十字（带高光） -->
  <g filter="url(#gloss)">
    <rect x="97" y="125" width="6" height="20" rx="2" fill="#1976D2" />
    <rect x="90" y="132" width="20" height="6" rx="2" fill="#1976D2" />
  </g>
  
  <!-- 底部文字 -->
  <text x="100" y="175" 
        font-family="'Segoe UI', Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="#E3F2FD" 
        text-anchor="middle"
        filter="url(#shadow)">
    CervixDetectAI
  </text>
</svg>
