name: Update LOC Badge

# 触发条件：推送到主分支时执行，支持手动触发
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# 允许工作流提交并推送 README 变更
permissions:
  contents: write

concurrency:
  group: loc-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-badge:
    name: Calculate and Update LOC
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Install Dependencies
        # 引入 cloc 进行统计，引入 jq 解析 JSON 数据
        run: sudo apt-get update && sudo apt-get install -y cloc jq

      - name: 3. Calculate Core LOC
        id: calc
        run: |
          # 排除依赖包、构建产物与缓存目录，确保只统计核心源码
          TOTAL_LOC=$(cloc . --exclude-dir=node_modules,venv,.git,build,dist,__pycache__,coverage,.quasar --json | jq -r '.SUM.code // 0')

          # 异常处理：确保获取到的值为数字
          if ! [[ "$TOTAL_LOC" =~ ^[0-9]+$ ]]; then
            echo "Error: LOC parsing failed."
            exit 1
          fi

          echo "total_loc=$TOTAL_LOC" >> "$GITHUB_OUTPUT"
          echo "Current Core Lines of Code: $TOTAL_LOC"

      - name: 4. Inject into README
        run: |
          if [[ ! -f README.md ]]; then
            echo "README.md not found."
            exit 1
          fi

          # 若已存在 LOC 徽章则更新；否则在徽章区新增一行
          if grep -qE 'https://img\.shields\.io/badge/LOC-[0-9]+-[^)"]+' README.md; then
            sed -i -E "s|(https://img.shields.io/badge/LOC-)[0-9]+(-[A-Za-z0-9%]+)|\1${{ steps.calc.outputs.total_loc }}\2|g" README.md
            echo "LOC badge updated."
          else
            sed -i "/img.shields.io\\/badge\\/TypeScript/a [![LOC](https://img.shields.io/badge/LOC-${{ steps.calc.outputs.total_loc }}-blue)](#-项目统计)" README.md
            echo "LOC badge inserted."
          fi

      - name: 5. Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 仅在 README 实际变化时提交，避免空提交
          if git diff --quiet -- README.md; then
            echo "LOC unchanged. No commit needed."
            exit 0
          fi

          git add README.md
          git commit -m "docs: update lines of code badge to ${{ steps.calc.outputs.total_loc }} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
